name: Daily Instagram Card News

on:
  # 매일 08:00 KST = 전날 23:00 UTC
  schedule:
    - cron: "0 23 * * *"
  # 수동 실행 - 필요할 때 템플릿/주제/대본을 직접 지정할 수 있음
  workflow_dispatch:
    inputs:
      template_name:
        description: "템플릿 강제 지정 (비우면 랜덤). 예: photo_style, grid_card_style, night_impact_style"
        required: false
        default: ""
      topic_override:
        description: "주제 직접 지정 (비우면 자동 생성)"
        required: false
        default: ""
      custom_script:
        description: "대본 JSON 직접 입력 (비우면 그록이 자동 생성). hook/items/quote/cta 구조로 붙여넣기"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 카드뉴스 생성 및 발행
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic_override }}
          CUSTOM_SCRIPT: ${{ github.event.inputs.custom_script }}
        run: python main.py

      - name: 사용한 주제 기록 커밋
        run: |
          git config user.name "card-news-bot"
          git config user.email "actions@github.com"
          git add used_topics.json || true
          git diff --cached --quiet || git commit -m "업데이트: used_topics.json"
          git push || true
