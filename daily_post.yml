name: Daily Instagram Card News

on:
  # 매일 08:00 KST = 전날 23:00 UTC
  schedule:
    - cron: "0 23 * * *"
  # 수동으로 즉시 실행해볼 수 있는 버튼 (Actions 탭에서 "Run workflow")
  workflow_dispatch:

permissions:
  contents: write  # used_topics.json을 저장소에 다시 커밋하기 위해 필요

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 카드뉴스 생성 및 발행
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: 사용한 주제 기록 커밋 (다음 실행에서 중복 방지)
        run: |
          git config user.name "card-news-bot"
          git config user.email "actions@github.com"
          git add used_topics.json || true
          git diff --cached --quiet || git commit -m "업데이트: used_topics.json"
          git push || true
